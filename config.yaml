# Unified Configuration File for NLP Interpretability Project
# This file contains all configuration settings for the entire project

# Global settings
global:
  seed: 42
  device: "mps"  # auto, mps, cpu, cuda
  log_level: "INFO"
  model: "bag-of-words-tfidf"  # Default model type

# Paths
paths:
  results_dir: "results"
  data_dir: "data"
  models_dir: "results/models"
  logs_dir: "results/logs"
  figures_dir: "results/figures"
  tables_dir: "results/tables"
  artifacts_dir: "results/artifacts"
  processed_data_dir: "data/processed"
  cache_dir: "data/cache"

# Reproducibility settings
reproducibility:
  deterministic: true
  benchmark: false
  tokenizers_parallelism: false
  cublas_workspace_config: ":4096:8"

# Data configuration
data:
  # Global data settings
  # Fraction of dataset to use (1.0 = use all data, 0.5 = use 50%, etc.)
  data_fraction: 1.0  # Use 100% of data by default
  # Split ratios: 0.1 = 10% validation, 0.1 = 10% test (80% train)
  validation_split: 0.1  # 10% of combined data for validation
  test_split: 0.1  # 10% of combined data for test (80% train)
  combine_train_test: true  # Combine train+test then split 80/10/10
  force_reprocess: true
  
  # Text processing
  text_column: "text"
  label_column: "label"
  label_mapping:
    0: "negative"
    1: "positive"
  
  # Caching
  use_cache: true
  
  # Available datasets
  datasets:
    imdb:
      name: "imdb"
      source: "huggingface"
      dataset_id: "imdb"
      version: "1.0.0"
      cache_dir: "${paths.cache_dir}/imdb"
    yelp_polarity:
      name: "yelp_polarity"
      source: "huggingface"
      dataset_id: "yelp_polarity"
      version: "1.0.0"
      cache_dir: "${paths.cache_dir}/yelp_polarity"
    amazon_polarity:
      name: "amazon_polarity"
      source: "huggingface"
      dataset_id: "amazon_polarity"
      version: "1.0.0"
      cache_dir: "${paths.cache_dir}/amazon_polarity"

  # Data preprocessing pipeline
  preprocessing:
    # Text cleaning
    text_cleaning:
      remove_html_tags: true
      remove_urls: true
      remove_mentions: false
      remove_hashtags: false
      normalize_whitespace: true
      remove_extra_spaces: true
      
    # Text normalization
    text_normalization:
      lowercase: true
      strip_accents: "unicode"
      remove_punctuation: false
      normalize_unicode: true
      
    # Tokenization (for transformer models)
    tokenization:
      max_length: 512
      padding: "max_length"
      truncation: true
      return_tensors: "pt"
      add_special_tokens: true
      
    # Vectorization (for baseline models)
    vectorization:
      max_features: 1000
      ngram_range: [1, 2]
      min_df: 2
      max_df: 0.95
      stop_words: "english"
      lowercase: true
      strip_accents: "unicode"

  # Data loading settings
  data_loading:
    # Batch processing
    batch_size: 32
    shuffle: true
    num_workers: 0  # Use main process for MPS compatibility
    pin_memory: false  # Not needed for MPS
    
    # Memory management
    lazy_loading: true
    cache_processed_data: true
    max_cache_size: "2GB"
    
    # Data augmentation (disabled for overfitting experiments)
    augmentation:
      enabled: false
      techniques: []
      
  # Data validation
  data_validation:
    # Quality checks
    check_duplicates: true
    check_empty_texts: true
    check_label_distribution: true
    min_samples_per_class: 100
    
    # Statistics to compute
    compute_statistics:
      - "text_length_distribution"
      - "label_distribution"
      - "vocabulary_size"
      - "class_balance"

# Model configuration
models:
  # Global hyperparameters
  hyperparameters:
    learning_rate: 1e-3
    batch_size: 32
    num_epochs: 10
    weight_decay: 0.0
    dropout: 0.0

  # Transformer models
