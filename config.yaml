global:
  seed: 42
  device: cuda
  log_level: INFO
  model: bag-of-words-tfidf
paths:
  results_dir: /mnt/results
  data_dir: /mnt/data
  models_dir: /mnt/results/models
  logs_dir: /mnt/results/logs
  figures_dir: /mnt/results/figures
  tables_dir: /mnt/results/tables
  artifacts_dir: /mnt/results/artifacts
  processed_data_dir: /mnt/data/processed
  cache_dir: /mnt/data/cache
reproducibility:
  deterministic: true
  benchmark: false
  tokenizers_parallelism: false
  cublas_workspace_config: :4096:8
data:
  data_fraction: 1.0
  max_samples: 50000
  validation_split: 0.1
  test_split: 0.1
  combine_train_test: true
  force_reprocess: true
  text_column: text
  label_column: label
  label_mapping:
    0: negative
    1: positive
  use_cache: true
  datasets:
    imdb:
      name: imdb
      source: huggingface
      dataset_id: imdb
      version: 1.0.0
      cache_dir: /mnt/data/cache/imdb
    yelp_polarity:
      name: yelp_polarity
      source: huggingface
      dataset_id: yelp_polarity
      version: 1.0.0
      cache_dir: /mnt/data/cache/yelp_polarity
    amazon_polarity:
      name: amazon_polarity
      source: huggingface
      dataset_id: amazon_polarity
      version: 1.0.0
      cache_dir: /mnt/data/cache/amazon_polarity
  preprocessing:
    text_cleaning:
      remove_html_tags: true
      remove_urls: true
      remove_mentions: false
      remove_hashtags: false
      normalize_whitespace: true
      remove_extra_spaces: true
    text_normalization:
      lowercase: true
      strip_accents: unicode
      remove_punctuation: false
      normalize_unicode: true
    tokenization:
      max_length: 512
      padding: max_length
      truncation: true
      return_tensors: pt
      add_special_tokens: true
    vectorization:
      max_features: 1000
      ngram_range:
      - 1
      - 2
      min_df: 2
      max_df: 0.95
      stop_words: english
      lowercase: true
      strip_accents: unicode
  data_loading:
    batch_size: 32
    shuffle: true
    num_workers: 4
    pin_memory: true
    lazy_loading: true
    cache_processed_data: true
    max_cache_size: 2GB
    augmentation:
      enabled: false
      techniques: []
  data_validation:
    check_duplicates: true
    check_empty_texts: true
    check_label_distribution: true
    min_samples_per_class: 100
    compute_statistics:
    - text_length_distribution
    - label_distribution
    - vocabulary_size
    - class_balance
models:
  hyperparameters:
    learning_rate: 1e-3
    batch_size: 32
    num_epochs: 10
    weight_decay: 0.0
    dropout: 0.0
  transformer_models:
    multiberts-seed_0:
      type: transformer
      model_name: google/multiberts-seed_0
      tokenizer_name: google/multiberts-seed_0
      num_labels: 2
      max_length: 512
      batch_size: 16
      learning_rate: 2e-5
      weight_decay: 1e-2
      num_epochs: 10
      gradient_accumulation_steps: 1
      adam_epsilon: 1e-8
      max_grad_norm: 1.0
      warmup_steps: 0
      early_stopping: true
      early_stopping_patience: 3
